<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>منصة الدردشة الخاصة بي</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="welcome">
            <h1>منصة الدردشة الخاصة بي</h1>
            <p>أنشئ حسابك وابدأ استخدام التطبيق.</p>
        </section>

        <section class="auth-card">

            <div class="tabs">
                <button id="loginTab" class="tab active" type="button">
                    تسجيل الدخول
                </button>

                <button id="registerTab" class="tab" type="button">
                    إنشاء حساب
                </button>
            </div>

            <!-- تسجيل الدخول -->
            <form id="loginForm">

                <h2>تسجيل الدخول</h2>

                <label for="loginEmail">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="أدخل بريدك الإلكتروني"
                    required
                >

                <label for="loginPassword">كلمة المرور</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="أدخل كلمة المرور"
                    required
                >

                <button type="submit" class="main-button">
                    تسجيل الدخول
                </button>

            </form>

            <!-- إنشاء حساب -->
            <form id="registerForm" class="hidden">

                <h2>إنشاء حساب جديد</h2>

                <label for="registerUsername">اسم المستخدم</label>
                <input
                    type="text"
                    id="registerUsername"
                    placeholder="اسم المستخدم"
                    minlength="3"
                    required
                >

                <label for="registerName">الاسم الظاهر</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="اسمك"
                    required
                >

                <label for="registerEmail">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="example@email.com"
                    required
                >

                <label for="registerPassword">كلمة المرور</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="6 أحرف أو أكثر"
                    minlength="6"
                    required
                >

                <button type="submit" class="main-button">
                    إنشاء الحساب
                </button>

            </form>

            <!-- التحقق من البريد -->
            <form id="verifyForm" class="hidden">

                <h2>تأكيد البريد الإلكتروني</h2>

                <p>
                    أرسلنا رمز تحقق من 6 أرقام إلى بريدك الإلكتروني.
                </p>

                <label for="verificationCode">رمز التحقق</label>
                <input
                    type="text"
                    id="verificationCode"
                    placeholder="أدخل رمز التحقق"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required
                >

                <button type="submit" class="main-button">
                    تأكيد البريد الإلكتروني
                </button>

            </form>

            <div id="message"></div>

        </section>

        <footer>
            <p>منصة الدردشة الخاصة بي © 2026</p>
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
